# DEMO — DELIBERATELY BROKEN. Do not copy this into a real project.
name: demo

on:
  push:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Show API key
        run: echo "sk-demo-FAKE-TOKEN-1234"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Run tests
        run: npm test
        continue-on-error: true
      - name: Deploy
        run: ./deploy.sh
